name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    name: Build and package extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Set version from tag
        shell: bash
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          sed -i.bak "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" public/manifest.json
          rm -f public/manifest.json.bak
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build
        run: npm run build

      - name: Package for Chrome
        run: |
          cd dist
          zip -r "../cuti-io-browser-extension-chrome-${VERSION}.zip" . -x ".DS_Store"
          cd ..

      - name: Package for Firefox
        run: |
          cd dist
          zip -r "../cuti-io-browser-extension-firefox-${VERSION}.zip" . -x ".DS_Store"
          cd ..

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: cuti-io-browser-extension-*.zip
