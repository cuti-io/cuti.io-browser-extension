name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    name: Build and package extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Set version from tag
        shell: bash
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          sed -i.bak "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" public/manifest.json
          rm -f public/manifest.json.bak
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build
        run: npm run build

      - name: Package for Chrome
        run: |
          cd dist
          zip -r "../cuti-io-browser-extension-chrome-${VERSION}.zip" . -x ".DS_Store"
          cd ..

      - name: Package for Firefox
        run: |
          cd dist
          zip -r "../cuti-io-browser-extension-firefox-${VERSION}.zip" . -x ".DS_Store"
          cd ..

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Upload Chrome package artifact
        uses: actions/upload-artifact@v7
        with:
          name: chrome-package
          path: cuti-io-browser-extension-chrome-*.zip

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: cuti-io-browser-extension-*.zip

  publish-chrome:
    name: Publish to Chrome Web Store
    needs: [package]
    environment: store-publish
    runs-on: ubuntu-latest
    steps:
      - name: Download Chrome package
        uses: actions/download-artifact@v8
        with:
          name: chrome-package
          path: .

      - name: Upload and publish to Chrome Web Store
        shell: bash
        env:
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
        run: |
          ZIP_FILE=$(ls cuti-io-browser-extension-chrome-*.zip)
          npx --yes chrome-webstore-upload-cli \
            --source "$ZIP_FILE" \
            --extension-id cdmikknjlmaelcoacbeaikdlmhmknnee

  publish-firefox:
    name: Publish to Firefox Add-ons
    needs: [package]
    environment: store-publish
    runs-on: ubuntu-latest
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Submit to Firefox Add-ons
        shell: bash
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          npx --yes web-ext sign \
            --source-dir dist \
            --channel=listed \
            --api-key="$AMO_JWT_ISSUER" \
            --api-secret="$AMO_JWT_SECRET"
